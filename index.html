<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday Sayang</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="stars"></canvas>
<canvas id="fireworks"></canvas>

<audio id="music" src="music.mp3" loop></audio>
<button class="music-btn" onclick="toggleMusic()">🎵</button>

<div class="content">
  <h1>HAPPY BIRTHDAY</h1>

<button class="gift-btn" onclick="openGift()">🎁 Buka Hadiah</button>

<div class="gift-box" id="giftBox">
  <div class="gift-content">
    <h3>🎥 Kejutan Untuk Kamu 💖</h3>

    <video id="giftVideo" controls autoplay>
      <source src="Sayang.mp4" type="video/mp4">
      Browser kamu tidak mendukung video.
    </video>

    <button onclick="closeGift()">Tutup</button>
  </div>
</div>

  <h2 id="name"></h2>

  <div class="slideshow">
    <img id="slide" src="foto/1.jpg">
  </div>

  <div class="cake">🎂<span class="candle">🔥</span></div>

  <p>
    tidak semua cerita harus berakhir bersama tapi aku tetap berharap hidup mu selalu peduh keberuntungan dan hal baik ✨
  </p>
</div>

<script src="script.js"></script>
</body>
</html>
